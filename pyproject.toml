[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-security-monitor"
version = "0.1.0"
description = "A Python security event monitoring and detection platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [
    { name = "Derek Gonzalez" }
]
dependencies = [
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1"

]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "httpx2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]